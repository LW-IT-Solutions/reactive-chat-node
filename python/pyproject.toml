[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-node"
version = "2.0.0"
description = "reactive.chat AI node: answer your workspace's AI jobs with your own OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "reactive.chat" }]
dependencies = []
keywords = ["reactive.chat", "llm", "openai-compatible", "vllm", "ollama", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Environment :: No Input/Output (Daemon)",
]

[project.urls]
Homepage = "https://reactive.chat"

[project.scripts]
rc-node = "rc_node:main"

[tool.setuptools]
py-modules = ["rc_node"]
